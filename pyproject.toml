[project]
name = "instrument-capture-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi>=0.110",
    "pillow>=10.0",
    "python-multipart>=0.0.9",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.29",
    "arena_api",
    "camlib",
    "numpy>=2.2.6",
    "tifffile>=2025.5.10",
    "mecheyeapi>=2.6.0",
]

[tool.uv]
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
camlib = {path = "wheels/camlib-0.9.12-cp310-cp310-win_amd64.whl"}
arena_api = {path = "wheels/arena_api-2.9.5-py3-none-any.whl"}

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "opencv-stubs>=0.1.3",
    "pytest>=9.1.1",
]


[tool.pytest.ini_options]
testpaths = ["tests", ".github/hooks/tests"]

[tool.ruff]
line-length = 250
extend-exclude = [
    "*_pb2.py",
    "*_pb2_grpc.py",
    "*_pb2.pyi",
    ".venv",
    "build",
    "third_party",
]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "D", "UP", "ANN", "S", "B", "COM", "C90",
    "DTZ", "EM", "ERA", "FBT", "FIX", "PD", "PIE", "PL", "PTH", "Q",
    "RET", "RUF", "SIM", "T20", "TD", "TRY", "ARG", "CPY", "FURB",
]
ignore = [
    "E501", "E741", "F401", "F403", "F405", "N806", "N812",
    "D200", "D205", "D212", "D403", "D415", "ANN401",
    "S101", "S311", "S404", "S603", "S607", "B008",
    "COM812", "COM819", "C901", "DTZ", "EM101", "EM102", "TRY003",
    "ERA001", "FBT001", "FBT002", "FBT003", "FIX002", "TD003", "PD",
    "PIE790", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLW0603",
    "PTH", "Q", "RET504", "RET505", "RUF001", "RUF002", "RUF003",
    "RUF005", "SIM108", "SIM114", "T201", "ARG002", "CPY001",
    "FURB113", "FA100", "TC004",
]
fixable = ["ALL"]
unfixable = ["F841", "ERA001", "T201"]

[tool.ruff.lint.per-file-ignores]
"src/generated/*.py" = ["ALL"]
"__init__.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-public-methods = 30

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
show_error_codes = true
incremental = true
cache_dir = ".mypy_cache"
explicit_package_bases = true
files = ["src"]
mypy_path = "src"
strict = true
warn_unused_configs = true
warn_no_return = true
warn_unreachable = true
implicit_reexport = true
allow_redefinition = true
exclude = [
    '^.*_pb2\.py$',
    '^.*_pb2_grpc\.py$',
    '^.*_pb2\.pyi$',
    'src/generated/.*',
    '\.venv/',
    'third_party/.*',
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "cv2",
    "cv2.*",
    "vision_pb2",
    "vision_pb2_grpc",
    "yolact.*",
    "yolo.*",
    "grpc.*",
    "google.protobuf.*",
    "yaml.*",
    "pandas.*",
    "matplotlib.*",
    "halcon.*",
    "skimage.*",
    "torchvision.*",
    "pytest.*",
    "open3d.*",
    "keyboard.*",
    "scipy.*",
    "numpy.*",
    "ultralytics.*",
]
ignore_errors = true
