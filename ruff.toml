# ================================================================================================
# Ruff (静的コード解析ツール) 設定
# ターゲット: ロボティクス・AI推論・分散システム開発用（Pythonの版は固定しない）
# ================================================================================================

# ------------------------------------------------------------------------------------------------
# 全体設定
# ------------------------------------------------------------------------------------------------
line-length = 250    # 行列演算や型ヒント、複雑な条件式を許容するため長めに設定
# target-version は指定しない: pyproject.toml の requires-python から自動判定される

# 解析除外設定 (自動生成ファイルおよび非ソースコード)
extend-exclude = [
    "*_pb2.py",
    "*_pb2_grpc.py",
    "*_pb2.pyi",
    "src/generated/*.py",
    "src/env_yolact/yolact",
    "src/env_yolo/ultralytics",
    ".venv",
    "build",
    "third_party",
]

[lint]
# ------------------------------------------------------------------------------------------------
# 1. チェックルールの有効化 (select)
# ------------------------------------------------------------------------------------------------
select = [
    "E",    # pycodestyle errors: 基本的なスタイル違反
    "W",    # pycodestyle warnings: 軽微な警告
    "F",    # Pyflakes: 論理的なエラー（未定義変数など）
    "I",    # isort: インポート順序の整理
    "N",    # pep8-naming: 命名規則
    "D",    # pydocstyle: Docstring規約
    "UP",   # pyupgrade: モダンな構文へのアップグレード
    "ANN",  # flake8-annotations: 型アノテーション
    "S",    # flake8-bandit: セキュリティ診断
    "B",    # flake8-bugbear: 潜在的なバグ設計
    "COM",  # flake8-commas: カンマの整合性
    "C90",  # mccabe: 循環複雑度
    "DTZ",  # flake8-datetimez: タイムゾーン制御
    "EM",   # flake8-errmsg: 例外メッセージの書式
    "ERA",  # eradicate: コメントアウトコードの検出
    "FBT",  # flake8-boolean-trap: ブール値引数の罠防止
    "FIX",  # flake8-fixme: 作業残し(TODO等)の管理
    "PD",   # pandas-vet: pandas操作の最適化
    "PIE",  # flake8-pie: 断片的なリファクタリング
    "PL",   # Pylint: 広範な品質・エラーチェック
    "PTH",  # flake8-use-pathlib: モダンなパス操作
    "Q",    # flake8-quotes: クォーテーションの一貫性
    "RET",  # flake8-return: return文の最適化
    "RUF",  # Ruff-specific rules: Ruff独自ルール
    "SIM",  # flake8-simplify: 構文の簡略化
    "T20",  # flake8-print: print文の混入チェック
    "TD",   # flake8-todo: TODOの管理形式
    "TRY",  # tryceratops: 例外処理のアンチパターン
    "ARG",  # flake8-unused-arguments: 未使用引数
    "CPY",  # flake8-copyright: 著作権表示
    "FURB", # refurb: ベストプラクティスへのリファクタリング
]

# ------------------------------------------------------------------------------------------------
# 2. プロジェクト全体で無視するルール (ignore) - select順にソート
# ------------------------------------------------------------------------------------------------
ignore = [
    # E, W: pycodestyle
    "E501",    # 行長制限 (全体設定で250としているため無視)
    "E741",    # 曖昧な変数名 (l, O, I等)

    # F: Pyflakes
    "F401",    # 未使用のimport (開発中の利便性)
    "F403",    # `from module import *` (gRPC等で稀に使用)
    "F405",    # `import *` 由来の変数定義

    # N: pep8-naming
    "N806",    # 関数内の大文字変数 (行列やテンソル計算で許容)
    "N812",    # 小文字パッケージへの大文字エイリアス (torch.nn as NN等)

    # D: pydocstyle
    "D200",    # 1行docstringの複数行記述
    "D205",    # サマリーと詳細間の空行強制無効
    "D212",    # 複数行docstringの改行開始
    "D403",    # 先頭文字の大文字強制無効
    "D415",    # 末尾の句点強制無効

    # ANN: flake8-annotations
    "ANN401",  # Any型の使用許可

    # S: flake8-bandit
    "S101",    # assert文 (pytest/型ガードで使用)
    "S311",    # 疑似乱数 random の使用
    "S404",    # subprocessモジュールの使用
    "S603",    # shell=False の subprocess 呼び出し
    "S607",    # 外部コマンドの相対パス指定

    # B: flake8-bugbear
    "B008",    # デフォルト引数での関数呼び出し

    # COM: flake8-commas
    "COM812", "COM819", # カンマの有無に関する警告

    # C90: mccabe
    "C901",    # 循環複雑度の制限解除

    # DTZ: flake8-datetimez
    "DTZ",     # タイムゾーン未指定のdatetime

    # EM, TRY: Error handling
    "EM101", "EM102", "TRY003", # 例外メッセージの直接記述

    # ERA: eradicate
    "ERA001",  # コメントアウトされたコード (unfixableで保護)

    # FBT: flake8-boolean-trap
    "FBT001", "FBT002", "FBT003", # bool値引数の制限解除

    # FIX, TD: Todo management
    "FIX002", "TD003", # TODO残存およびIssueリンク強制の無効

    # PD: pandas-vet
    "PD",      # pandas固有の警告

    # PIE: flake8-pie
    "PIE790",  # 不要なpass文

    # PL: Pylint
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", # 関数規模・複雑度の制限解除
    "PLW0603", # global文の使用

    # PTH: flake8-use-pathlib
    "PTH",     # pathlib強制 (os.pathも許容)

    # Q: flake8-quotes
    "Q",       # クォーテーションの混在

    # RET: flake8-return
    "RET504", "RET505", # return直前の代入やelseの最適化

    # RUF: Ruff
    "RUF002",  # 紛らわしい全角文字 (コメント等で使用)
    "RUF005",  # リスト結合の最適化強制
    "RUF001",  # 紛らわしい全角文字（文字列）。日本語の文字列で誤検出されるため無効
    "RUF003",  # 紛らわしい全角文字（コメント）。日本語コメントを必須としているため無効

    # SIM: flake8-simplify
    "SIM108", "SIM114", # 構文の簡略化強制

    # T: flake8-print / flake8-unused-arguments
    "T201",    # print文 (unfixableで保護)
    "ARG002",  # 未使用のメソッド引数

    # その他
    "CPY001",  # Copyright表記強制
    "FURB113", # appendのextend変換強制
    "FA100",   # __future__ import強制
    "TC004",   # TYPE_CHECKINGブロック移動
]

# ------------------------------------------------------------------------------------------------
# 3. 自動修正(fix)を許可するルールの設定
# 原則として ALL を指定し、安全に自動修正可能なものはすべて Ruff に任せます。
# ------------------------------------------------------------------------------------------------
fixable = ["ALL"]

# 特に自動修正の影響を受ける主要なカテゴリとその内容:
# E, W (pycodestyle):
#   - インデント、演算子周囲の空白、不要な空行、カンマ後のスペースなどの整形
#   - 例: `x=1` -> `x = 1`, `[ 1,2]` -> `[1, 2]`
# I (isort):
#   - インポート文の標準・外部・ローカルライブラリごとの並び替えとグループ化
# D (pydocstyle):
#   - Docstringの末尾の空白削除や、Googleスタイルに基づく基本的な構造修正
# UP (pyupgrade):
#   - 古いPython構文の最新化
#   - 例: `dict()` -> `{}`, `set([])` -> `set()`, 型ヒントの `typing.List` -> `list`
# F (Pyflakes):
#   - 未使用のインポートの自動削除 (ignoreにF401が入っていても、fixableにALLがあれば手動/自動修正時に削除可能)
# SIM (flake8-simplify):
#   - `if a: return True else: return False` -> `return bool(a)` のような簡略化
# B (flake8-bugbear):
#   - ループ内での不要な関数の呼び出しの最適化など
# RUF (Ruff独自):
#   - リスト内包表記への書き換えや、重複した辞書キーの削除など

# ------------------------------------------------------------------------------------------------
# 4. 自動修正(fix)を「禁止」するルールの設定
# ロジックを勝手に書き換えると危険なもの、または手動で確認しながら修正したいものを指定します。
# ------------------------------------------------------------------------------------------------
unfixable = [
    "F841",    # 未使用のローカル変数 (勝手に消すとデバッグ時に不便なため手動で判断)
    "ERA001",  # コメントアウトされたコード (重要なロジックのバックアップかもしれないため勝手に消さない)
    "T201",    # print文の削除 (デバッグログを勝手に消さない)
]

# ------------------------------------------------------------------------------------------------
# 4. 特定のファイル単位での無視設定 / プラグイン詳細設定
# ------------------------------------------------------------------------------------------------
[lint.per-file-ignores]
"src/generated/*.py" = ["ALL"] # gRPC等の自動生成コードはすべて無視
"tests/*" = ["S101"]           # テストコードでの assert 使用を許可
"__init__.py" = ["F401", "D"] # パッケージ初期化ファイルでの未使用importとDocstring欠落を許可

[lint.pydocstyle]
convention = "google" # GoogleスタイルのDocstring規約を採用

[lint.pylint]
max-public-methods = 30 # クラスの公開メソッド数の上限を緩和 (ロボティクス制御クラス用)

# ------------------------------------------------------------------------------------------------
# 5. 整形機能の設定 (format)
# ------------------------------------------------------------------------------------------------
[format]
quote-style = "double" # 文字列引用符をダブルクォートに統一
indent-style = "space" # インデントにスペースを使用
