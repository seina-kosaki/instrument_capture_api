# ================================================================================================
# Ruff(静的コード解析ツール)設定
# https://docs.astral.sh/ruff/
# 全体設定
line-length = 250          # 1行の最大文字数
target-version = "py38"     # 解析対象のpythonバージョン
#解析対象外のフォルダ設定
exclude = [
  "**/gen/**",              # protocが生成したスタブファイル
  "**/yolact/**",           # YOLACT(https://github.com/dbolya/yolact)
  "**/metrics/**",          # Metrics(https://github.com/4uiiurz1/pytorch-adacos/blob/master/metrics.py)
  "**/calibration/**",
  "calibration",
  "**/calibration",
  "**/test/**"
]

# lint 時の挙動に関する詳細設定
[lint]
# Previewルールに対するリント・フォーマットを有効にする
# (https://docs.astral.sh/ruff/preview/)
preview = true

# 解析時に適用するルール
select = ["ALL"]

# 解析時/自動修正時に無視するルール
# ルールの詳細は https://docs.astral.sh/ruff/rules/ を参照
ignore = [
    "ERA001",  # Pythonコードをコメントアウトした場合に対する警告
    "T201",    # print関数の使用に対する警告
    "FBT003",  # ブール値を位置引数として渡した場合に対する警告
    "PLR0913", # 関数の引数が多すぎる場合に対する警告
    "E741",    # 曖昧な変数名に対する警告
    "PTH",     # pathlibを使わない場合に対する警告
    "D205",    # summary行とdescription行の間に空行がない場合に対する警告
    "D200",    # 1行のdocstringが複数行になっている場合に対する警告
    "D212",    # 複数行のdocstringが改行で始まる場合に対する警告
    "D415",    # docstringの1行目が . ! ? で終わらない場合に対する警告
    "FA100",   # Python 3.9以降の新しい型アノテーション使用時の互換性に対する警告
    "PIE790",  # 不要なpass文に対する警告
    "Q",       # クオーテーションの混在に対する警告
    "COM812",  # 配列の最後にコンマがない場合に対する警告
    "COM819",  # 配列の最後にコンマがある場合に対する警告
    "N806",    # 変数名がlower_case以外の場合に対する警告
    "PD",      # pandas系操作に関する警告
    "TRY003",  # 例外メッセージを例外クラスのインスタンス生成時に引数で渡すことへの警告（標準例外クラスではこの使い方で良いため。）
    "S603",    # Shell無しのsubprocessに対する警告
    "B008",    # 関数のデフォルト引数に関数呼び出しを使用することへの警告
    "D403",    # Docstringの先頭文字が大文字でないことへの警告
    "ARG002",  # 未使用引数に対する警告
    "EM101",   # 例外メッセージにraw-stringを使用することへの警告
    "EM102",   # 例外メッセージにf-stringを使用することへの警告
    "FBT001",  # 位置引数にbooleanが使用されることへの警告
    "FBT002",  # booleanの一引数にデフォルト引数が設定されていることへの警告
    "SIM108",  # if-else文を簡潔に書いていないことへの警告
    "DTZ",     # TimeZone関連の警告
    "TD003",   # TODOにIssueLinkがないことへ警告
    "FIX002",  # TODOコメントが残っていることへ警告
    "RUF002",  #　( （など紛らわしい文字の使用に関する警告
    "ANN204",  #　__init__()の戻り値の型がないことへの警告
    "SIM114",  # if文をorでまとめていないことへの警告
    # "ANN004",  # 引数型にAnyを使用することへの警告。除外したいがruff側で保存エラーが出る。
    "C901",    # if文のネストが深いことへの警告
    "PLR0912", # if文の数が多いことへの警告
    "PLR0915", # if文の数が多いことへの警告
    "F401",    # 未使用importに対警告警告
    "ANN401",  # Any型の使用を禁止
    "PLW0603", # globalの使用禁止
    "F403",    # *を用いたimport禁止
    "F405",    # *を用いてimportした変数の使用禁止
    "RET504",  # retuanで使わない変数定義で返す
    "PLR0911", # returnの数が多い
    "RET505",  # elifを使用した記述に対する警告
    "N812",    # lower_caseのパッケージにupper_caseのエイリアスを付けてimportしている。
    "S311",    # 標準の擬似乱数ジェネレーターは暗号目的には不適切であることへの警告
    "TC004",   # 循環参照を避けるキーワード'TYPE_CHECKING'を使用することへの警告
    "CPY001",  # ファイルの先頭にCopyrightがないことへの警告
    "S404",    # subprocessの使用に対する警告
    "S607",    # 外部コマンドを実行時に相対パスになっていることへの警告
    "S101",    # assertを使用することへの警告（pytestで使用するため）
    "RUF005",  # リストの結合に*を使用していないことへの警告
    "FURB113", # 複数回のppendをextendで代用しないことへの警告
]

# 保存時に自動修正するルール
fixable = [
    "D",       # docstring系フォーマットに対する自動修正
    "I",       # import文の並び替えに対する自動修正
    #Rules(https://docs.astral.sh/ruff/rules/#isort-i)には明記されていないが、
    #import文直後に2行強制挿入される(https://github.com/astral-sh/ruff/issues/9645)
    "UP039",   # クラス名の横にある()を削除する自動修正
    "W291",    # 不要なスペースの削除
    "W292",    # 最終行が改行されていない
    "W293",    # 空白行の不要なスペースの削除に対する自動修正
    "W391",    # ファイル末尾の改行が多すぎます (W391)
    # docstring内のW291, W292, W293は自動修正外
    "E114",    # 無効な複数コメントによるインデント (E114)
    "E115",    # インデントなしブロックコメント (E115)
    "E201",    # 開き括弧の後の空白 (E201)
    "E202",    # ,閉じ括弧の前の空白文字 (E202)
    "E203",    # ,前の空白スペースを消す
    "E221",    # 演算子の前の複数のスペース (E221)
    "E222",    # 演算子の後の複数のスペース (E222)
    "E225",    # 演算子の周囲の空白がない (E225)
    "E226",    # 算術演算子の周囲の空白がない (E226)
    "E231",    # , ; :の後ろにスペースを追加
    "E241",    # カンマの後の複数のスペース (E241)
    "E251",    # キーワードパラメータの前後に予期しないスペースがある (E251)
    "E252",    # パラメータの前後に空白がない (E252)
    "E261",    # inlineコメントの前は少なくとも2空白マス空ける
    "E262",    # blockコメントにスペース追加
    "E265",    # inlineコメントにスペース追加
    "E271",    # キーワードの後に​​複数のスペース (E271)
    "E275",    # キーワードの後の空白がない (E275)
    "E301",    # クラスのメソッド間は1行空ける
    "E302",    # Top-Levelの関数やクラス間は2行空ける
    "E303",    # 関数間の行数が空きすぎている場合に短縮する
    "E304",    # デコレータとデコレートしている関数間の空白行を消す
    "E305",    # クラス定義の直後は2行空ける
    "RUF022",
]

# docstringのチェック時に参照する規約
[lint.pydocstyle]
convention = "google"    

# ファイル単位でのルール無視設定
[lint.per-file-ignores]
"__init__.py" = ["F401", "D", ] # __init__.pyで発生するエラーは無視

[lint.pylint]
max-public-methods = 60    # 公開メソッドの最大数 (PLR0904)
