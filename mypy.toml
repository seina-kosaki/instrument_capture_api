# ================================================================================================
# Mypy (静的型チェックツール) 設定
# ターゲット: ロボティクス・AI・分散システム開発用（Pythonの版は固定しない）
# ================================================================================================

[tool.mypy]
# --- 基本設定 ---
# python_version は指定しない: 実行している .venv のPythonの版が使われる
show_error_codes = true      # エラー箇所に対応するエラーコードを表示
incremental = true           # キャッシュを有効化してチェックを高速化 (falseから変更を推奨)
cache_dir = ".mypy_cache"    # キャッシュの出力先 (パフォーマンスのため null は避けるのが一般的)
explicit_package_bases = true
files = ["src"]
mypy_path = "src"
# --- チェックの厳格化 (Strict Mode 相当) ---
strict = true                # 基本的にすべての厳格チェックを有効化
warn_unused_configs = true   # 設定ファイル内の未使用項目を警告
warn_redundant_casts = true  # 不要な型キャストを警告
warn_unused_ignores = true   # 不要な # type: ignore コメントを警告
warn_no_return = true        # 戻り値の型が指定されているのに return がない場合に警告
warn_unreachable = true     # 到達不能なコードを検出

# --- 個別ルールの調整 ---
disallow_any_generics = true       # ジェネリクスに明示的な型指定を強制 (例: list[int])
disallow_untyped_defs = true       # すべての関数定義に型ヒントを強制
check_untyped_defs = true          # 型ヒントがない関数の内部もチェック対象にする
disallow_untyped_decorators = true # 型定義のないデコレータの使用を禁止
implicit_reexport = true           # 他のモジュールからインポートしたものの再エクスポートを許可
strict_equality = true             # 比較演算子の両辺の型一致を厳格にチェック
allow_redefinition = true          # 同一スコープ内での変数名の再定義（型変更）を許可

# 自動生成ファイル、キャリブレーション、テスト、仮想環境を除外
# --- 除外設定 (物理的なスキャン除外) ---
exclude = [
    '^.*_pb2\.py$',
    '^.*_pb2_grpc\.py$',
    '^.*_pb2\.pyi$',
    'src/generated/.*',
    '\.venv/',
    # ディレクトリ名が含まれていれば、前後を問わず除外する設定に強化
    'third_party/.*',
]

# ここから ignore_errors = true を削除しました（重要）
ignore_missing_imports = true
# ------------------------------------------------------------------------------------------------
# モジュールごとの個別設定 (Overrides)
# ------------------------------------------------------------------------------------------------

[[tool.mypy.overrides]]
# cv2 とそのサブモジュールを明示的に指定
module = [
    "cv2",
    "cv2.*",
    "vision_pb2",
    "vision_pb2_grpc",
    "*_pb2",
    "*_pb2_grpc",
    "yolact.*",
    "yolo.*",
    "grpc.*",
    "google.protobuf.*",
    "yaml.*",
    "pandas.*",
    "matplotlib.*",
    "halcon.*",
    "skimage.*",
    "torchvision.*",
    "pytest.*",
    "open3d.*",
    "keyboard.*",
    "scipy.*",
    "numpy.*",
    "ultralytics.*",
]
# 型定義がないことによるエラーを無視
ignore_missing_imports = true
# これらのモジュール内部の解析エラーも無視
ignore_errors = true

# ------------------------------------------------------------------------------------------------
# エラーコードの個別制御
# ------------------------------------------------------------------------------------------------
# プロジェクト全体で無視したい特定のエラーコードがあればここに指定
# disable_error_code = ["misc"]