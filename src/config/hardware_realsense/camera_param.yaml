# ============================================================
# System Configuration File
# パラメータ・接続設定を定義するYAMLファイル。
# ===========================================================
# camerasについて
# - すべてのカメラ設定は CameraManager 経由で読み込まれる。
# - CameraFactory が type をキーにクラスを解決し、
# - config(dict) と extra(dict) をコンストラクタへ渡す。
# - 各クラスは CameraBase を継承しており、共通インターフェースを持つ。
# - frame_mode="shm" の場合、共有メモリでフレームを転送する（マルチプロセス対応）。
# - frame_mode="hw" の場合、ハードウェアトリガでフレームを転送する（非同期対応）。
# - frame_mode="sw" の場合、ソフトウェアトリガでフレームを転送する（同期対応）。
# - priority は接続順・切断順に影響する。
# - exec_mode = "process"の場合shmで立ち上げる場合マルチプロセス処理になる。
# - exec_mode = "thread"の場合shmで立ち上げる場合スレッド処理になる。
# 使用可能なカメラのtype
# - realsense -> opencv
# - 2dOpencv  -> opencv
# - basler -> halcon
# - iraple -> halcon
# - triton_and_helios -> halcon
# ============================================================


cameras:

  realsense:
    type: realsense
    resolution: [848, 480]
    fps: 90
    isShow : False
    frame_mode : "shm"
    priority: 1
    exec_mode: "thread" # thread or process
    extra:
      enable_color: True
      enable_depth: True
      enable_xyz: True
      enable_infrared: False
      align_to_color: True
      infrared_index: 1
      depth_unit: "mm"
      exposure: 8000
      stream_format: "RGBA"

